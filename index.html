<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1422"><title>EMPIRE X · Business Empire Simulator</title><style>:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1422;color:#f3f6fb}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:2px solid #19c4b5;outline-offset:2px}.app{min-height:100vh}.sidebar{width:230px;background:#0d1c2c;border-right:1px solid #253b4d;position:fixed;inset:0 auto 0 0;padding:25px 15px;display:flex;flex-direction:column;z-index:8}.logo{font-size:24px;font-weight:1000;letter-spacing:2px}.logo span{color:#19c4b5}.tagline{font-size:10px;letter-spacing:2px;color:#93a7b9;margin:4px 0 28px}.nav{display:grid;gap:5px}.nav button{width:100%;border:0;border-radius:10px;padding:13px 15px;text-align:left;color:#afc1cf;background:transparent}.nav button.active,.nav button:hover{background:#19374a;color:white}.sidebarfoot{margin-top:auto;color:#70889b;font-size:12px}.main{margin-left:230px;min-height:100vh}.top{padding:18px 26px;display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid #263949;background:#0e1b2b;flex-wrap:wrap}.top h1{font-size:22px;margin:0}.sub{color:#8197aa;font-size:12px;margin-top:5px}.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.button{border:1px solid #345265;background:#172c3d;color:#e4eff6;border-radius:9px;padding:9px 13px;font-size:13px}.button:hover{border-color:#19c4b5}.button.primary{background:#19c4b5;color:#061c25;border-color:#19c4b5;font-weight:800}.button.danger{border-color:#9a4e54;color:#ffafae}.button.selected{background:#d9a95c;color:#14202a;border-color:#d9a95c}.shell{padding:24px;max-width:1550px;margin:auto}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:#132537;border:1px solid #2b4153;border-radius:14px;padding:19px}.metriclabel{font-size:12px;color:#98adbe}.metric{font-size:25px;font-weight:850;margin-top:8px;white-space:nowrap}.positive{color:#37d4ab}.negative{color:#ff777b}.title{font-size:18px;font-weight:750;margin:0 0 15px}.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:15px;margin-top:18px}.section{margin-top:20px}.list{display:grid;gap:10px}.item{padding:13px;background:#0e1e2d;border:1px solid #284258;border-radius:11px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.muted{color:#93aab9;font-size:13px}.pill{font-size:11px;padding:5px 9px;border-radius:30px;background:#234153;color:#72e6d4}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.formline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input,select{background:#0b1927;border:1px solid #355064;border-radius:8px;padding:10px;color:#fff;max-width:100%}input[type=number]{width:80px}.field{display:grid;gap:7px;margin:14px 0}.field label{color:#92aabb;font-size:12px}.field input{width:100%}.modalback{position:fixed;inset:0;background:#020911db;z-index:20;display:grid;place-items:center;padding:15px}.modal{width:min(100%,530px);max-height:88vh;overflow-y:auto;background:#132538;border:1px solid #34516b;border-radius:18px;padding:27px;box-shadow:0 30px 110px #000a}.modal h1{margin:0 0 10px;font-size:30px}.modal p{color:#9fb3c3;line-height:1.55}.eyebrow{font-size:11px;letter-spacing:2px;color:#19c4b5}.notice{padding:13px;border:1px solid #46634b;background:#17362e;border-radius:11px;font-size:13px;margin:12px 0}.warning{background:#402c29;border-color:#6e4444}.mapframe{position:relative;min-height:520px;background:radial-gradient(ellipse at 50% 45%,#1c3d46,#0b1e30);border-radius:13px;overflow:hidden;border:1px solid #314f5b;touch-action:none}.mapframe canvas{width:100%;height:520px;display:block;cursor:grab;touch-action:none}.mapframe canvas:active{cursor:grabbing}.maphelp{position:absolute;left:12px;bottom:12px;background:#0b1728d9;padding:9px 12px;border-radius:9px;font-size:11px;color:#c5d6df;pointer-events:none}.place{font-size:12px;color:#88a9b7;margin-top:5px}.progress{height:7px;background:#294050;border-radius:8px;overflow:hidden;margin-top:7px}.progress>div{height:100%;background:#19c4b5}.log{height:280px;overflow:auto}.logline{padding:9px 0;border-bottom:1px solid #294255;color:#bdd0dc;font-size:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:13px;border-radius:9px;background:#0b1b2a}.chart{width:100%;height:180px}.footerbar{position:fixed;bottom:0;left:0;right:0;z-index:9;background:#0d1c2cf7;border-top:1px solid #294054;display:none;justify-content:space-around;padding:8px 2px calc(8px + env(safe-area-inset-bottom))}.footerbar button{border:0;background:none;color:#9caebe;font-size:11px;padding:8px}.footerbar button.active{color:#19c4b5}.empty{padding:32px;text-align:center;color:#8fa5b4}.accent{color:#e5b45a}.separator{height:1px;background:#2b4153;margin:16px 0}.toast{position:fixed;bottom:20px;right:20px;padding:14px 18px;border-radius:11px;background:#1b574d;color:white;z-index:30;box-shadow:0 15px 50px #0008;max-width:330px}.badge{background:#224354;color:#c7e5ef;font-size:12px;border-radius:8px;padding:6px 9px}.copyright{font-size:11px;color:#647c8f;padding:22px 0}.titleline{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}.btnsm{padding:7px 10px;font-size:12px}.avatar{height:42px;width:42px;border-radius:50%;background:linear-gradient(130deg,#296b72,#17283f);display:grid;place-items:center;font-weight:800;color:#a2fff1}.producticon{width:36px;height:36px;border-radius:9px;background:#23445a;display:grid;place-items:center;font-size:20px}.center{text-align:center}@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.sidebar{width:190px}.main{margin-left:190px}}@media(max-width:700px){.sidebar{display:none}.main{margin-left:0;padding-bottom:74px}.shell{padding:12px}.top{padding:15px}.top h1{font-size:19px}.controls{width:100%}.button{padding:8px 10px}.kpis{gap:8px}.card{padding:13px}.metric{font-size:20px}.grid2,.grid3{grid-template-columns:1fr}.mapframe,.mapframe canvas{min-height:410px;height:410px}.footerbar{display:flex}.modal{padding:19px}.statgrid{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><script>const KEY='empire-x-local-v1';
const $=s=>document.querySelector(s);
const money=n=>new Intl.NumberFormat('es-PA',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(n/100);
const num=n=>new Intl.NumberFormat('es-PA').format(n);
const products=[{id:'food',name:'Alimentos',icon:'🥫',cost:450,price:750,demand:7},{id:'drink',name:'Bebidas',icon:'🥤',cost:180,price:350,demand:10},{id:'clean',name:'Limpieza',icon:'🧴',cost:550,price:950,demand:5},{id:'home',name:'Hogar',icon:'🏠',cost:900,price:1550,demand:3}];
const roles={cashier:{name:'Cajero',salary:75000},seller:{name:'Vendedor',salary:82000},stocker:{name:'Reponedor',salary:69000},supervisor:{name:'Supervisor',salary:120000}};
const names=['Mariana López','Daniel Pérez','Sofía Ortega','Luis Castillo','Valeria Mendoza','Carlos Rivera','Lucía Torres','Pedro Morales','Gabriela Ruiz','Andrés Vega','Camila Salazar','Mateo Ríos'];
const $el=(tag,cls,txt)=>{let e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e};
const hash=(x,y,seed=45)=>{let a=Math.sin((x+1)*127.1+(y+1)*311.7+seed*17.3)*43758.5453;return a-Math.floor(a)};
let state,tab='dashboard',selectedTile=null,mod=null,shopTab='overview',speed=0,elapsed=0,dirty=false,toastTimeout,frame=performance.now();
const tileType=(x,y)=>{if(x===9||y===9||x===10||y===10)return 'road';const h=hash(x,y);if(h<.22)return 'park';if(h<.45)return 'residential';if(h<.59)return 'commercial';if(h<.66)return 'industrial';return 'empty'};
const defaultState=(name='Jugador',difficulty='normal')=>({version:1,id:'EX-'+Date.now().toString(36),name,difficulty,day:1,seconds:8*3600,capital:({easy:5000000,normal:2500000,hard:1000000})[difficulty],lots:[],shop:null,staff:[],transactions:[],reports:[],events:[],missions:[],seq:0,seed:Math.floor(Math.random()*100000),reputation:55,customers:0,totalSales:0,created:Date.now()});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));dirty=false;return true}catch(e){notice('No se pudo guardar; revisa el espacio del navegador.',true);return false}};
const entry=(type,amount,desc,day=state.day)=>{state.capital+=amount;state.transactions.unshift({id:++state.seq,type,amount,desc,day});state.transactions=state.transactions.slice(0,800);dirty=true};
function eventLog(desc){state.events.unshift({day:state.day,desc});state.events=state.events.slice(0,100);dirty=true}
function notice(msg,isError=false){let t=$('.toast');if(t)t.remove();t=$el('div','toast',msg);if(isError)t.style.background='#803b42';document.body.append(t);clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>t.remove(),3600)}
function success(msg){save();notice(msg);render()}
function ensureEnough(amount){if(state.capital<amount){notice('Fondos insuficientes para realizar la operación.',true);return false}return true}
function newGame(name,difficulty){state=defaultState((name||'Magnate').trim().slice(0,50),difficulty);tab='city';selectedTile=null;speed=0;eventLog('¡Tu nueva historia empresarial comienza!');save();render()}
function candidates(){return names.map((name,i)=>({id:i,name,role:Object.keys(roles)[i%4],skill:50+Math.floor(hash(i,13,state.seed)*46),motivation:55+Math.floor(hash(i,14,state.seed)*40),loyalty:40+Math.floor(hash(i,16,state.seed)*50)}))}
function hire(index){if(!state.shop)return notice('Primero construye un comercio.',true);const c=candidates()[index];if(state.staff.some(s=>s.id===c.id))return notice('Esta persona ya trabaja contigo.',true);if(state.staff.length>=8)return notice('Tu tienda llegó a su capacidad de 8 empleados.',true);const fee=15000;if(!ensureEnough(fee))return;entry('personnel',-fee,`Contratación: ${c.name}`);state.staff.push({...c,hired:state.day});eventLog(`Contrataste a ${c.name} como ${roles[c.role].name}.`);success(`${c.name} se unió a tu empresa.`)}
function dismiss(id){const p=state.staff.find(s=>s.id===id);if(!p)return;state.staff=state.staff.filter(s=>s.id!==id);eventLog(`${p.name} dejó la empresa.`);success('Empleado desvinculado.')}
function changePrice(id,value){if(!state.shop)return;const p=products.find(p=>p.id===id),v=Math.round(Number(value)*100);if(!Number.isFinite(v)||v<Math.round(p.cost*0.5)||v>p.cost*6)return notice('Precio fuera del rango permitido.',true);state.shop.prices[id]=v;success('Precio actualizado.')}
function buyStock(id,quantity){if(!state.shop)return notice('Construye un comercio primero.',true);let p=products.find(p=>p.id===id);quantity=Math.floor(Number(quantity));if(!Number.isFinite(quantity)||quantity<1||quantity>1000)return notice('Cantidad entre 1 y 1000.',true);let cost=p.cost*quantity;if(!ensureEnough(cost))return;entry('inventory',-cost,`Compra de ${quantity} unidades de ${p.name}`);state.shop.inventory[id]+=quantity;eventLog(`Se recibieron ${quantity} unidades de ${p.name}.`);success(`Inventario actualizado: +${quantity} de ${p.name}.`)}
function buyLot(x,y){if(tileType(x,y)!=='empty')return notice('Este terreno no se encuentra disponible.',true);if(state.lots.length>0)return notice('Sprint 1: solo se permite un terreno comercial.',true);if(!ensureEnough(600000))return;entry('asset',-600000,`Compra de terreno (${x}, ${y})`);state.lots.push({x,y});eventLog(`Compraste un terreno en (${x}, ${y}).`);success('Terreno adquirido por $6,000.')}
function buildShop(){if(!state.lots.length)return notice('Compra un terreno primero.',true);if(state.shop)return notice('Ya tienes tu primera tienda.',true);if(!ensureEnough(300000))return;entry('asset',-300000,'Equipamiento y adecuación de tienda');state.shop={name:'Mercado '+state.name.slice(0,20),lot:state.lots[0],inventory:Object.fromEntries(products.map(p=>[p.id,0])),prices:Object.fromEntries(products.map(p=>[p.id,p.price])),open:false,days:0};eventLog('Tu primer comercio está construido. Compra inventario, contrata personal y ábrelo.');success('Comercio construido. ¡Ya puedes abastecerlo!')}
function toggleShop(){if(!state.shop)return;if(!state.shop.open&&!state.staff.some(s=>s.role==='cashier'))return notice('Necesitas al menos un cajero para abrir.',true);state.shop.open=!state.shop.open;eventLog(state.shop.open?'¡La tienda abrió sus puertas!':'La tienda cerró temporalmente.');success(state.shop.open?'Tienda abierta.':'Tienda cerrada.')}
function random(day,seed=0){return hash(day,seed,state.seed)}
function processDay(){if(!state)return;const day=state.day;let revenue=0,cogs=0,units=0,customers=0,expenses=0,shortages=0;if(state.shop){let staff=state.staff;let cashiers=staff.filter(s=>s.role==='cashier'),sellers=staff.filter(s=>s.role==='seller'),stockers=staff.filter(s=>s.role==='stocker'),supervisors=staff.filter(s=>s.role==='supervisor');let capacity=Math.round((cashiers.reduce((a,s)=>a+s.skill,0)/100*42+sellers.reduce((a,s)=>a+s.skill,0)/100*18+supervisors.length*12)*(1+(stockers.length*.04)));let remaining=capacity;const occ=state.shop.open;
  for(let p of products){if(!occ)continue;let price=state.shop.prices[p.id],ref=p.price,priceFactor=Math.max(.15,Math.min(1.65,1.6-.65*(price/ref))),repFactor=.75+state.reputation/200,variation=.7+.6*random(day,products.indexOf(p));let requested=Math.max(0,Math.floor(p.demand*priceFactor*repFactor*variation*(1+sellers.length*.11)));let desired=Math.min(requested,remaining);let sold=Math.min(desired,state.shop.inventory[p.id]);shortages+=desired-sold;state.shop.inventory[p.id]-=sold;revenue+=sold*price;cogs+=sold*p.cost;units+=sold;customers+=sold;remaining-=sold}
  if(occ)state.shop.days++;let dailyRent=day%30===0?85000:0;let wage=day%30===0?staff.reduce((a,s)=>a+roles[s.role].salary,0):0;let utilities=occ?4500:1000;expenses=dailyRent+wage+utilities;if(dailyRent)entry('expense',-dailyRent,'Alquiler y mantenimiento mensual',day);if(wage)entry('expense',-wage,'Nómina mensual',day);entry('expense',-utilities,'Servicios y mantenimiento diario',day);if(revenue)entry('sale',revenue,`Ventas de ${units} unidades`,day);let profit=revenue-cogs-expenses;state.reports.push({day,revenue,cogs,expenses,profit,units,customers,shortages,capital:state.capital});state.reports=state.reports.slice(-1000);state.customers+=customers;state.totalSales+=units;state.reputation=Math.min(100,Math.max(10,state.reputation+(shortages>2?-1:(units>12?1:0))));if(shortages>2)eventLog(`Faltó inventario: ${shortages} ventas potenciales no se concretaron.`);if(day%7===0&&state.shop.open)eventLog(`Informe semanal: ${money(state.reports.slice(-7).reduce((a,r)=>a+r.profit,0))} de resultado acumulado.`);}
 state.day++;state.seconds=8*3600;dirty=true;save()}
function advanceDays(n=1){n=Math.max(1,Math.min(365,Math.floor(n)));for(let i=0;i<n;i++)processDay();notice(`Avanzaste ${n} día${n>1?'s':''} simulado${n>1?'s':''}.`);render()}
function clockStep(realDelta){if(!state||speed===0)return;state.seconds+=realDelta*4*speed;if(state.seconds>=86400){let count=0;while(state.seconds>=86400&&count<10){state.seconds-=86400;processDay();count++}render()}else{const e=$('#clock');if(e)e.textContent=clockText()}}
function clockText(){let s=Math.floor(state.seconds),h=Math.floor(s/3600)%24,m=Math.floor(s%3600/60);return `Día ${state.day} · ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`}
function appHTML(){if(!state){return `<div class="modalback"><div class="modal"><div class="eyebrow">BUSINESS EMPIRE SIMULATOR</div><h1>EMPIRE <span style="color:#19c4b5">X</span></h1><p>Construye tu imperio desde cero. Compra terrenos, abre tu primera tienda, contrata empleados, vende mercancía y administra tus finanzas.</p><div class="field"><label>Nombre de tu imperio</label><input id="playerName" maxlength="50" placeholder="Ej. Grupo Empire" value="Mi Imperio"></div><div class="field"><label>Dificultad</label><select id="difficulty"><option value="easy">Fácil · $50,000</option><option value="normal" selected>Normal · $25,000</option><option value="hard">Difícil · $10,000</option></select></div><button class="button primary" id="createGame">Comenzar nueva partida →</button><p class="muted">Se guarda automáticamente en este navegador. No necesitas cuentas, Supabase ni Vercel.</p></div></div>`}
let labels={dashboard:'Resumen',city:'Ciudad',shop:'Mi negocio',staff:'Empleados',finances:'Finanzas',missions:'Objetivos'};return `<div class="app"><aside class="sidebar"><div class="logo">EMPIRE <span>X</span></div><div class="tagline">BUSINESS EMPIRE SIMULATOR</div><div class="nav">${Object.entries(labels).map(([k,v])=>`<button data-tab="${k}" class="${tab===k?'active':''}">${{dashboard:'▦',city:'▧',shop:'▣',staff:'♙',finances:'▥',missions:'✦'}[k]} &nbsp; ${v}</button>`).join('')}</div><div class="sidebarfoot">PARTIDA LOCAL · ${state.id}<br>Guardado automático ✓</div></aside><main class="main"><header class="top"><div><h1>${esc(labels[tab])}</h1><div class="sub"><span id="clock">${clockText()}</span> · ${esc(state.name)}</div></div><div class="controls"><span class="badge">💰 ${money(state.capital)}</span>${[0,1,2,5,10].map(n=>`<button class="button btnsm ${speed===n?'selected':''}" data-speed="${n}">${n===0?'⏸':'▶ '+n+'×'}</button>`).join('')}<button class="button btnsm" id="nextDay">+1 día</button><button class="button btnsm" id="saveGame">Guardar</button></div></header><div class="shell">${({dashboard:dashboardHTML,city:cityHTML,shop:shopHTML,staff:staffHTML,finances:financesHTML,missions:missionsHTML})[tab]()}<div class="copyright">EMPIRE X · Sprint 1 · Simulación ficticia · Los datos permanecen en tu navegador. <button class="button btnsm" id="exportGame">Exportar partida</button> <button class="button btnsm" id="importGame">Importar</button> <button class="button btnsm danger" id="resetGame">Nueva partida</button><input type="file" id="importFile" accept="application/json" hidden></div></div></main><div class="footerbar">${Object.entries(labels).map(([k,v])=>`<button data-tab="${k}" class="${tab===k?'active':''}">${{dashboard:'▦',city:'▧',shop:'▣',staff:'♙',finances:'▥',missions:'✦'}[k]}<br>${v}</button>`).join('')}</div></div>`}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function kpi(label,value,cls=''){return `<div class="card"><div class="metriclabel">${label}</div><div class="metric ${cls}">${value}</div></div>`}
function recent(n=6){return state.events.slice(0,n).map(x=>`<div class="logline"><span class="accent">Día ${x.day}</span> · ${esc(x.desc)}</div>`).join('')||'<div class="empty">Aún no hay eventos.</div>'}
function dashboardHTML(){let r=state.reports.slice(-7),rev=r.reduce((a,x)=>a+x.revenue,0),prof=r.reduce((a,x)=>a+x.profit,0);return `<div class="kpis">${kpi('Capital disponible',money(state.capital))}${kpi('Ventas últimos 7 días',money(rev),'positive')}${kpi('Resultado últimos 7 días',money(prof),prof>=0?'positive':'negative')}${kpi('Unidades vendidas',num(state.totalSales))}</div><div class="split"><div class="card"><div class="titleline"><h2 class="title">Rendimiento del imperio</h2><span class="pill">7 días</span></div><canvas class="chart" id="chart" width="800" height="240"></canvas><div class="grid2 section"><div class="stat"><div class="metriclabel">Empleados</div><div class="metric">${state.staff.length}</div></div><div class="stat"><div class="metriclabel">Reputación</div><div class="metric">${state.reputation}/100</div></div></div></div><div class="card"><h2 class="title">Tu siguiente paso</h2>${guidance()}<div class="separator"></div><h3 class="title">Actividad reciente</h3><div class="log">${recent()}</div></div></div>`}
function guidance(){if(!state.lots.length)return '<p class="muted">El primer paso es adquirir un terreno para tu comercio.</p><button class="button primary" data-tab="city">Explorar terrenos →</button>';if(!state.shop)return '<p class="muted">Terreno listo. Construye una tienda por $3,000.</p><button class="button primary" data-action="build">Construir tienda</button>';if(!state.staff.some(s=>s.role==='cashier'))return '<p class="muted">La tienda necesita un cajero para poder vender.</p><button class="button primary" data-tab="staff">Contratar personal →</button>';if(Object.values(state.shop.inventory).every(v=>v===0))return '<p class="muted">Compra inventario para comenzar a vender.</p><button class="button primary" data-tab="shop">Comprar mercancía →</button>';if(!state.shop.open)return '<p class="muted">¡Listo para inaugurar! Abre las puertas y avanza un día.</p><button class="button primary" data-action="open">Abrir mi tienda</button>';return '<p class="muted">Tu empresa está operando. Ajusta precios, controla el inventario y crece sin quedarte sin liquidez.</p><button class="button primary" data-tab="shop">Administrar mi empresa →</button>'}
function cityHTML(){return `<div class="split" style="grid-template-columns:minmax(0,2fr) minmax(270px,1fr)"><div class="card"><div class="titleline"><h2 class="title">Distrito central · 20×20</h2><div class="flex"><button class="button btnsm" id="zoomOut">−</button><button class="button btnsm" id="zoomIn">+</button><button class="button btnsm" id="resetCam">Centrar</button></div></div><div class="mapframe"><canvas id="cityCanvas"></canvas><div class="maphelp">Arrastra para moverte · Toca una parcela para seleccionarla · Zoom con + / −</div></div></div><div class="card"><h2 class="title">Parcela seleccionada</h2><div id="plotPanel">${tilePanel()}</div><div class="separator"></div><h2 class="title">Leyenda</h2><div class="list"><div class="muted">🟩 Parques &nbsp; 🏘️ Residencial</div><div class="muted">🏢 Comercio &nbsp; 🏭 Industria</div><div class="muted">🟨 Terreno libre &nbsp; 🏪 Tu tienda</div></div></div></div>`}
function tilePanel(){if(!selectedTile)return '<div class="empty">Toca cualquier parcela de la ciudad para ver sus detalles.</div>';let {x,y}=selectedTile,t=tileType(x,y),own=state.lots.some(l=>l.x===x&&l.y===y);if(own)return `<div class="pill">Terreno de tu propiedad · (${x}, ${y})</div><p>${state.shop?'Tu tienda ya está construida sobre esta parcela.':'Terreno adquirido, listo para iniciar la construcción.'}</p>${!state.shop?'<button class="button primary" data-action="build">Construir tienda · $3,000</button>':'<button class="button primary" data-tab="shop">Administrar tienda</button>'}`;let lbl={road:'Carretera',park:'Parque',residential:'Zona residencial',commercial:'Comercio ocupado',industrial:'Zona industrial',empty:'Terreno comercial disponible'};return `<div class="pill">Parcela (${x},${y})</div><h3>${lbl[t]}</h3><p class="muted">${t==='empty'?'Propiedad apta para tu primera tienda.':'No puedes construir sobre esta parcela.'}</p>${t==='empty'?`<strong>Precio: $6,000</strong><p><button class="button primary" data-action="buyLot" data-x="${x}" data-y="${y}" ${state.lots.length?'disabled':''}>Comprar terreno</button></p>`:''}`}
function shopHTML(){if(!state.shop)return `<div class="card"><h2 class="title">Tu primera empresa</h2>${guidance()}</div>`;let s=state.shop,units=Object.values(s.inventory).reduce((a,b)=>a+b,0);return `<div class="titleline"><div><h2 class="title" style="margin:0">🏪 ${esc(s.name)}</h2><div class="place">Parcela (${s.lot.x},${s.lot.y}) · ${s.open?'🟢 Abierto':'🔴 Cerrado'}</div></div><button class="button ${s.open?'danger':'primary'}" data-action="open">${s.open?'Cerrar tienda':'Abrir tienda'}</button></div><div class="kpis">${kpi('Existencias',num(units))}${kpi('Empleados',num(state.staff.length))}${kpi('Reputación',state.reputation+'/100')}${kpi('Días operativos',num(s.days))}</div><div class="card section"><div class="tabs">${[['overview','Productos e inventario'],['orders','Compras'],['results','Resultados']].map(([id,l])=>`<button class="button ${shopTab===id?'selected':''}" data-shop-tab="${id}">${l}</button>`).join('')}</div>${shopTab==='overview'?products.map(p=>`<div class="item"><div class="flex"><span class="producticon">${p.icon}</span><div><strong>${p.name}</strong><div class="muted">Stock: ${s.inventory[p.id]} · Costo ${money(p.cost)}</div></div></div><div class="formline"><label class="muted">Precio</label><input type="number" step="0.5" min="0.5" data-price-input="${p.id}" value="${(s.prices[p.id]/100).toFixed(2)}"><button class="button btnsm" data-action="price" data-id="${p.id}">Guardar</button></div></div>`).join(''):shopTab==='orders'?products.map(p=>`<div class="item"><div class="flex"><span class="producticon">${p.icon}</span><div><strong>${p.name}</strong><div class="muted">Costo unitario ${money(p.cost)} · Stock ${s.inventory[p.id]}</div></div></div><div class="formline"><input aria-label="Cantidad" type="number" min="1" max="1000" value="20" data-qty-input="${p.id}"><button class="button primary btnsm" data-action="stock" data-id="${p.id}">Comprar</button></div></div>`).join(''):reportHTML()}</div>`}
function reportHTML(){let r=state.reports.slice(-7),sum=k=>r.reduce((a,x)=>a+x[k],0);return `<div class="statgrid">${[['Ingresos',sum('revenue')],['Costo de mercancía',sum('cogs')],['Gastos de operación',sum('expenses')],['Utilidad operativa',sum('profit')]].map(([a,b])=>`<div class="stat"><div class="metriclabel">${a}</div><div class="metric">${money(b)}</div></div>`).join('')}</div><p class="muted">Resumen de los últimos siete días simulados. El costo de productos vendidos se reconoce en el resultado cuando se venden, no cuando se compran.</p>`}
function staffHTML(){return `<div class="split"><div class="card"><h2 class="title">Equipo actual · ${state.staff.length}/8</h2>${state.staff.length?state.staff.map(p=>`<div class="item"><div class="flex"><div class="avatar">${p.name.split(' ').map(n=>n[0]).slice(0,2).join('')}</div><div><strong>${p.name}</strong><div class="muted">${roles[p.role].name} · ${money(roles[p.role].salary)}/mes</div><div class="place">Productividad ${p.skill}/100 · Motivación ${p.motivation}/100</div></div></div><button class="button danger btnsm" data-action="fire" data-id="${p.id}">Despedir</button></div>`).join(''):'<div class="empty">Aún no has contratado trabajadores.</div>'}</div><div class="card"><h2 class="title">Bolsa de empleo</h2><p class="muted">Contratación: $150 por candidato. Sus salarios se pagan cada 30 días simulados.</p><div class="list">${candidates().filter(c=>!state.staff.some(s=>s.id===c.id)).slice(0,8).map(c=>`<div class="item"><div><strong>${c.name}</strong><div class="muted">${roles[c.role].name} · ${money(roles[c.role].salary)}/mes</div><div class="place">Habilidad ${c.skill} · Lealtad ${c.loyalty}</div></div><button class="button primary btnsm" data-action="hire" data-id="${c.id}">Contratar</button></div>`).join('')}</div></div></div>`}
function financesHTML(){let r=state.reports.slice(-30),sum=k=>r.reduce((a,x)=>a+x[k],0);return `<div class="kpis">${kpi('Efectivo',money(state.capital))}${kpi('Ingresos últimos 30d',money(sum('revenue')),'positive')}${kpi('Gastos últimos 30d',money(sum('expenses')))}${kpi('Utilidad últimos 30d',money(sum('profit')),sum('profit')>=0?'positive':'negative')}</div><div class="split"><div class="card"><h2 class="title">Libro de movimientos</h2><div class="log" style="height:480px">${state.transactions.slice(0,100).map(e=>`<div class="item"><div><div>${esc(e.desc)}</div><div class="muted">Día ${e.day} · ${e.type}</div></div><strong class="${e.amount>=0?'positive':'negative'}">${e.amount>=0?'+':''}${money(e.amount)}</strong></div>`).join('')||'<div class="empty">No hay movimientos.</div>'}</div></div><div class="card"><h2 class="title">Informe de desempeño</h2>${reportHTML()}<div class="separator"></div><h2 class="title">Últimos cierres diarios</h2><div class="log">${r.slice(-15).reverse().map(e=>`<div class="item"><div>Día ${e.day}<div class="muted">${e.units} unidades vendidas</div></div><strong class="${e.profit>=0?'positive':'negative'}">${money(e.profit)}</strong></div>`).join('')||'<div class="empty">Avanza el primer día para generar un informe.</div>'}</div></div></div>`}
function missionList(){return [{text:'Comprar tu primer terreno',ok:state.lots.length>0},{text:'Construir una tienda',ok:!!state.shop},{text:'Contratar un cajero',ok:state.staff.some(s=>s.role==='cashier')},{text:'Comprar mercancía',ok:state.transactions.some(x=>x.type==='inventory')},{text:'Abrir tu comercio',ok:state.events.some(x=>x.desc.includes('abrió sus puertas'))},{text:'Vender al menos 10 productos',ok:state.totalSales>=10},{text:'Alcanzar 100 unidades vendidas',ok:state.totalSales>=100},{text:'Completar un día rentable',ok:state.reports.some(r=>r.profit>0)},{text:'Mantener abierto al menos 7 días',ok:state.shop?.days>=7},{text:'Jugar 30 días simulados',ok:state.day>30}]}
function missionsHTML(){let m=missionList(),done=m.filter(x=>x.ok).length;return `<div class="card"><div class="titleline"><h2 class="title">Tu camino a convertirte en magnate</h2><span class="pill">${done} / ${m.length} completadas</span></div><div class="progress"><div style="width:${done/m.length*100}%"></div></div><div class="section list">${m.map((x,i)=>`<div class="item"><div>${x.ok?'✅':'⬜'} &nbsp; ${i+1}. ${x.text}</div><span class="muted">${x.ok?'Completada':'Pendiente'}</span></div>`).join('')}</div><p class="muted">Las misiones te enseñan a administrar empresas sin regalar dinero ni alterar la economía.</p></div>`}
let cam={x:0,y:0,zoom:1},canvas,ctx,dpr=1,drag=null;
function citySetup(){canvas=$('#cityCanvas');if(!canvas)return;dpr=Math.min(2,window.devicePixelRatio||1);let rect=canvas.getBoundingClientRect();canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);drawCity();canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false}};canvas.onpointermove=e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>9)drag.moved=true;cam.x=drag.cx+dx;cam.y=drag.cy+dy;drawCity()};canvas.onpointerup=e=>{if(!drag)return;let moved=drag.moved;drag=null;if(!moved){let r=canvas.getBoundingClientRect(),p=pointToTile(e.clientX-r.left,e.clientY-r.top);if(p.x>=0&&p.x<20&&p.y>=0&&p.y<20){selectedTile=p;$('#plotPanel').innerHTML=tilePanel();drawCity()}}};canvas.onwheel=e=>{e.preventDefault();cam.zoom=Math.max(.45,Math.min(2.5,cam.zoom+(e.deltaY<0?.12:-.12)));drawCity()};}
function tileToPoint(x,y){let w=42*cam.zoom,h=21*cam.zoom,cw=canvas.clientWidth;return {x:cw/2+(x-y)*w+cam.x,y:54+(x+y)*h+cam.y}}
function pointToTile(px,py){let w=42*cam.zoom,h=21*cam.zoom,a=(px-canvas.clientWidth/2-cam.x)/w,b=(py-54-cam.y)/h;return {x:Math.floor((a+b)/2+.5),y:Math.floor((b-a)/2+.5)}}
function poly(pts,fill,stroke='#162e36'){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}
function drawCity(){if(!ctx)return;let ww=canvas.clientWidth,hh=canvas.clientHeight;ctx.clearRect(0,0,ww,hh);const bg=ctx.createLinearGradient(0,0,0,hh);bg.addColorStop(0,'#203f49');bg.addColorStop(1,'#0b1827');ctx.fillStyle=bg;ctx.fillRect(0,0,ww,hh);let w=42*cam.zoom,h=21*cam.zoom;for(let z=0;z<40;z++)for(let x=0;x<20;x++){let y=z-x;if(y<0||y>=20)continue;let p=tileToPoint(x,y),own=state.lots.some(l=>l.x===x&&l.y===y),t=tileType(x,y);let color={road:'#33454a',park:'#285b4c',residential:'#385a67',commercial:'#38536c',industrial:'#534d5c',empty:'#91723a'}[t];if(own)color='#b18f43';poly([[p.x,p.y-h],[p.x+w,p.y],[p.x,p.y+h],[p.x-w,p.y]],color);let height=({road:0,park:0,empty:0,residential:14,commercial:26,industrial:17})[t]*cam.zoom;if(own&&state.shop)height=28*cam.zoom;if(height){let top=p.y-height,front='#223d54',side='#152e43',roof='#5b8193';if(t==='residential'){front='#284f61';roof='#64899a'}if(t==='industrial'){front='#4b495d';roof='#75758b'}if(own&&state.shop){front='#0d827e';roof='#29c7b7'}poly([[p.x-w*.58,p.y-h*.58],[p.x,p.y],[p.x,top],[p.x-w*.58,top-h*.58]],front);poly([[p.x,p.y],[p.x+w*.58,p.y-h*.58],[p.x+w*.58,top-h*.58],[p.x,top]],side);poly([[p.x,top-h*.9],[p.x+w*.58,top-h*.58],[p.x,top],[p.x-w*.58,top-h*.58]],roof);if(w>22){ctx.fillStyle='#c1e9ea';ctx.fillRect(p.x-w*.38,p.y-height*.52,4*cam.zoom,5*cam.zoom)}}if(selectedTile&&selectedTile.x===x&&selectedTile.y===y){ctx.strokeStyle='#f7cf72';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x,p.y-h);ctx.lineTo(p.x+w,p.y);ctx.lineTo(p.x,p.y+h);ctx.lineTo(p.x-w,p.y);ctx.closePath();ctx.stroke()}}}
function chartDraw(){let cv=$('#chart');if(!cv)return;let dpr=Math.min(2,devicePixelRatio||1),r=cv.getBoundingClientRect();cv.width=r.width*dpr;cv.height=r.height*dpr;let c=cv.getContext('2d');c.scale(dpr,dpr);let w=r.width,h=r.height,arr=state.reports.slice(-20);c.strokeStyle='#29465c';for(let i=1;i<5;i++){let y=h*i/5;c.beginPath();c.moveTo(10,y);c.lineTo(w-10,y);c.stroke()}if(!arr.length){c.fillStyle='#8195a5';c.font='13px sans-serif';c.fillText('Avanza los días para visualizar los resultados',16,h/2);return}let values=arr.flatMap(p=>[p.revenue,p.expenses+p.cogs]),max=Math.max(1,...values)*1.1;function line(key,color){c.beginPath();arr.forEach((p,i)=>{let x=10+(w-20)*i/Math.max(1,arr.length-1),y=h-12-(h-25)*p[key]/max;if(i)c.lineTo(x,y);else c.moveTo(x,y)});c.strokeStyle=color;c.lineWidth=2.5;c.stroke()}line('revenue','#19c4b5');c.beginPath();arr.forEach((p,i)=>{let x=10+(w-20)*i/Math.max(1,arr.length-1),y=h-12-(h-25)*(p.expenses+p.cogs)/max;if(i)c.lineTo(x,y);else c.moveTo(x,y)});c.strokeStyle='#e5b45a';c.lineWidth=2.5;c.stroke();c.fillStyle='#19c4b5';c.fillText('Ingresos',14,12);c.fillStyle='#e5b45a';c.fillText('Costos + gastos',86,12)}
function render(){let app=$('#app');app.innerHTML=appHTML();bind();if(state){if(tab==='city')citySetup();if(tab==='dashboard')chartDraw()}}
function bind(){const create=$('#createGame');if(create)create.onclick=()=>newGame($('#playerName').value,$('#difficulty').value);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{speed=Number(b.dataset.speed);render()});document.querySelectorAll('[data-shop-tab]').forEach(b=>b.onclick=()=>{shopTab=b.dataset.shopTab;render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b));const next=$('#nextDay');if(next)next.onclick=()=>advanceDays(1);const sv=$('#saveGame');if(sv)sv.onclick=()=>notice(save()?'Partida guardada.':'Error al guardar.',!dirty);const reset=$('#resetGame');if(reset)reset.onclick=()=>{if(confirm('¿Borrar la partida actual? Puedes exportarla antes de crear otra.')){localStorage.removeItem(KEY);state=null;speed=0;render()}};const exp=$('#exportGame');if(exp)exp.onclick=()=>{save();const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='empire-x-'+state.id+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};const imp=$('#importGame');if(imp)imp.onclick=()=>$('#importFile').click();const f=$('#importFile');if(f)f.onchange=async()=>{try{const s=JSON.parse(await f.files[0].text());if(!validSave(s))throw Error('Archivo incompatible');if(!confirm('¿Reemplazar partida actual con la importada?'))return;state=s;speed=0;save();render();notice('Partida restaurada correctamente.')}catch(e){notice('No se pudo importar: '+e.message,true)}};for(let [id,fn]of [['zoomIn',()=>cam.zoom=Math.min(cam.zoom+.15,2.5)],['zoomOut',()=>cam.zoom=Math.max(cam.zoom-.15,.45)],['resetCam',()=>{cam={x:0,y:0,zoom:1}}]]){let b=$('#'+id);if(b)b.onclick=()=>{fn();drawCity()}}}
function act(b){let a=b.dataset.action,id=b.dataset.id;switch(a){case 'buyLot':buyLot(Number(b.dataset.x),Number(b.dataset.y));break;case 'build':buildShop();break;case 'open':toggleShop();break;case 'stock':buyStock(id,document.querySelector(`[data-qty-input="${id}"]`).value);break;case 'price':changePrice(id,document.querySelector(`[data-price-input="${id}"]`).value);break;case 'hire':hire(Number(id));break;case 'fire':if(confirm('¿Despedir a este empleado?'))dismiss(Number(id));break}}
function validSave(s){return s&&s.version===1&&typeof s.name==='string'&&Number.isSafeInteger(s.capital)&&s.capital>=-100000000&&Number.isSafeInteger(s.day)&&s.day>0&&s.day<10000000&&Array.isArray(s.lots)&&Array.isArray(s.staff)&&Array.isArray(s.reports)&&Array.isArray(s.transactions)&&Array.isArray(s.events)&&typeof s.seed==='number'&&(!s.shop||(s.shop.inventory&&s.shop.prices&&products.every(p=>Number.isSafeInteger(s.shop.inventory[p.id])&&s.shop.inventory[p.id]>=0&&Number.isSafeInteger(s.shop.prices[p.id])&&s.shop.prices[p.id]>0)))}
try{let raw=localStorage.getItem(KEY);state=raw?JSON.parse(raw):null;if(state&&!validSave(state)){state=null;console.warn('Saved game could not be validated')}}catch(e){state=null}
render();function animation(t){let dt=Math.min(1,(t-frame)/1000);frame=t;clockStep(dt);requestAnimationFrame(animation)}requestAnimationFrame(animation);window.addEventListener('beforeunload',()=>{if(state)save()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state){speed=0;save()}});window.addEventListener('resize',()=>{if(tab==='city'&&state)citySetup();else if(tab==='dashboard'&&state)chartDraw()});
</script></body></html>
